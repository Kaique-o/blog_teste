<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="ir para home">
      <span class="brand-dot">•</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <nav class="nav" aria-label="navegacao principal">
      {% for item in site.data.navigation %}
      <a class="nav-link{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{
        item.title }}</a>
      {% endfor %}
    </nav>

    <div class="header-cta">
      <button class="btn btn-ghost icon-btn" type="button" id="themeToggle" aria-label="alternar tema"
        title="alternar tema">
        <span class="icon" aria-hidden="true">◐</span>
      </button>
    </div>

    <button class="btn btn-ghost burger" type="button" id="navToggle" aria-label="abrir menu" aria-controls="mobileNav"
      aria-expanded="false">
      <span aria-hidden="true">≡</span>
    </button>
  </div>

  <div class="mobile-nav" id="mobileNav" hidden>
    <div class="container mobile-nav-inner">
      {% for item in site.data.navigation %}
      <a class="mobile-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
      <a class="btn btn-primary btn-block" href="{{ '/contato/' | relative_url }}">contrate-me</a>
    </div>
  </div>
</header>
